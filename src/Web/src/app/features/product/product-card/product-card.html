<div class="product-card">
  <div class="product-image">
    <app-product-card-image [mainImage]="product.images[0]" [secondaryImage]="product.images[1]"/>
    <app-product-card-wishlist-btn [productId]="product.id" />
  </div>
  <div class="product-info">
    <div class="color-options">
      @for (color of product.colorOptions.slice(0, 3); track color.id) {
        <app-product-color-swatch [color]="color"
                                  [isSelected]="color.id === selectedColorId" (colorChange)="onColorChange($event)"/>
      }
      @if (product.colorOptions.length > 3) {
        <span class="more-colors">+{{ product.colorOptions.length - 3 }}</span>
      }
    </div>
    <span class="product-title">{{ product.title }}</span>
    <div class="price-container">
      @if (product.isOnSale)
      {
        <span class="product-sale-price"
              [class.sale]="product.isOnSale">
          <span class="price-amount">{{ product.salePrice }}</span> грн
        </span>
      }
      <span class="product-price"
            [class.sale]="product.isOnSale">
        <span class="price-amount">{{ product.price }}</span> грн
      </span>
    </div>
  </div>
  <div class="add-to-cart-container">
    <select class="size-selector" aria-label="Select Size" [formControl]="selectedSize">
      <option value='' selected disabled hidden>Розмір</option>
      @for (size of product.sizes; track size) {
        <option value="{{ size }}">{{ size }}</option>
      }
    </select>
    <button class="add-to-cart-button" aria-label="Add to Cart"
            [class.active]="selectedSize.value"
            (click)="addToCart()">
      <fa-icon [icon]="faShoppingCart" />
    </button>
  </div>
</div>
